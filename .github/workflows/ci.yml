name: CI Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant-tests:
    name: Assistant AI Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "assistant/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r assistant/requirements.txt

      - name: Run Pytest suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest assistant/tests/ -v

  backend-tests:
    name: Go Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend build stage
        run: |
          docker build --target build -t alpha-hack-backend-test .

      - name: Run Go unit tests
        run: |
          docker run --rm alpha-hack-backend-test go test -v ./internal/...

  docker-compose-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: |
          docker compose build
