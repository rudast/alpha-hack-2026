services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      WEB_DIR: /app/web
      DATABASE_URL: postgres://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}?sslmode=disable
      REDIS_ADDR: redis:6379
      OTP_STUB_CODE: ${OTP_STUB_CODE:-000000}
      TRUST_REFRESH_INTERVAL: ${TRUST_REFRESH_INTERVAL:-12h}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-8s}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit} -d ${POSTGRES_DB:-credit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
