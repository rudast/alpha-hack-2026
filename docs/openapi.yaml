openapi: 3.0.3
info:
  title: Умный кредитный кабинет — API
  version: 0.1.0
  description: >
    Реализованы `/healthz`, `/api/v1/auth/login`, `/api/v1/auth/verify` и
    `/api/v1/me/bootstrap`. Остальные методы — черновой контракт, он будет меняться
    по ходу разработки.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: client
  - name: employee
paths:
  /healthz:
    get:
      tags: [system]
      summary: Проверка работоспособности
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход, шаг 1 — пароль
      description: >
        Клиент входит по телефону и паролю, сотрудник по почте и паролю. После проверки пароля
        отправляется код второго фактора (сейчас заглушка, принимает код из `OTP_STUB_CODE`,
        по умолчанию `000000`). Сессия на этом шаге не создаётся.
        На любую проблему с учётными данными (нет такого пользователя, неверный пароль,
        неподходящая роль) возвращается один и тот же ответ 401.
        После трёх неудачных попыток вход блокируется на 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Пароль верен, код отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Некорректное тело запроса
        "401":
          description: Неверные учётные данные
        "429":
          description: Слишком много неудачных попыток
          headers:
            Retry-After:
              schema: { type: integer }
              description: Секунд до снятия блокировки
  /api/v1/auth/verify:
    post:
      tags: [auth]
      summary: Вход, шаг 2 — код второго фактора
      description: >
        Проверяет код и создаёт сессию. Вызов `challenge_id` одноразовый, живёт 5 минут;
        после трёх неверных кодов он аннулируется. Поле `redirect` определяет сервер по роли:
        `/personalAccount` для клиента, `/employee` для сотрудника.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          description: Неверный код либо вызов не найден или истёк
  /api/v1/me/bootstrap:
    post:
      tags: [client]
      summary: Обновить показатели долговой нагрузки после входа
      description: >
        Вызывается клиентом после входа. Если коэффициент долговой нагрузки ни разу не считался
        или старше 12 часов, запрашивает кредитную историю у воркера и ждёт ответа не дольше
        `WORKER_TIMEOUT` (по умолчанию 8 секунд). Если данные устарели, а воркер не ответил,
        возвращаются прежние значения. Если данных не было вовсе, ответ 503.
        Сценарий реализован отдельным методом сервиса, его можно вызывать и из других мест.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Показатели долговой нагрузки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          description: Нет сессии
        "403":
          description: Метод только для клиентов
        "404":
          description: Компания клиента не найдена
        "503":
          description: Воркер не ответил вовремя, повторите запрос
          headers:
            Retry-After:
              schema: { type: integer }
  /api/v1/products:
    get:
      tags: [client]
      summary: Каталог кредитных продуктов
      responses:
        "200":
          description: Список продуктов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /api/v1/loans:
    get:
      tags: [client]
      summary: Действующие кредиты клиента и общая сумма долга
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Кредиты и долговая нагрузка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoansOverview"
  /api/v1/calculator:
    post:
      tags: [client]
      summary: Расчёт платежа по будущему кредиту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculatorRequest"
      responses:
        "200":
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculatorResponse"
  /api/v1/applications:
    post:
      tags: [client]
      summary: Создать черновик заявки
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /api/v1/applications/{id}:
    get:
      tags: [client]
      summary: Заявка с историей статусов
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Заявка не найдена
  /api/v1/applications/{id}/submit:
    post:
      tags: [client]
      summary: Отправить заявку (с проверкой полноты полей)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка отправлена, статус SUBMITTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "422":
          description: Не заполнены обязательные поля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /api/v1/employee/applications:
    get:
      tags: [employee]
      summary: Очередь заявок для андеррайтера
      security: [{ bearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
      responses:
        "200":
          description: Список заявок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
  /api/v1/employee/applications/{id}/decision:
    post:
      tags: [employee]
      summary: Решение по заявке на ручной проверке
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Решение принято
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    LoginRequest:
      type: object
      required: [role, password]
      properties:
        role: { type: string, enum: [client, employee] }
        phone:
          type: string
          description: Только для клиента; принимаются форматы +79990000001, 89990000001, 8 (999) 000-00-01
        email: { type: string, description: Только для сотрудника }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        challenge_id: { type: string }
    VerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string }
        code: { type: string }
    VerifyResponse:
      type: object
      properties:
        token: { type: string, description: Передаётся в заголовке Authorization как Bearer }
        role: { type: string, enum: [client, employee] }
        redirect:
          type: string
          example: /personalAccount
    Bootstrap:
      type: object
      properties:
        inn: { type: string }
        total_debt: { type: integer, format: int64, nullable: true, description: Общий долг по всем банкам, рубли }
        equity: { type: integer, format: int64, nullable: true, description: Собственный капитал, рубли }
        debt_to_equity:
          type: number
          nullable: true
          description: Общий долг / собственный капитал; null, если капитал нулевой или отрицательный
        fetched_at: { type: string, format: date-time, nullable: true }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        min_amount: { type: number }
        max_amount: { type: number }
        max_term_months: { type: integer }
        base_rate: { type: number }
    LoansOverview:
      type: object
      properties:
        loans:
          type: array
          items: { type: object }
        total_debt: { type: number }
        debt_to_equity:
          type: number
          description: Общий долг / собственный капитал; значение больше 2 ухудшает скоринг
    CalculatorRequest:
      type: object
      required: [product_id, amount, term_months]
      properties:
        product_id: { type: string }
        amount: { type: number }
        term_months: { type: integer }
    CalculatorResponse:
      type: object
      properties:
        monthly_payment: { type: number }
        total_payment: { type: number }
        rate: { type: number }
    ApplicationInput:
      type: object
      properties:
        inn: { type: string }
        org_type: { type: string, enum: [IP, OOO] }
        product_id: { type: string }
        amount: { type: number }
        term_months: { type: integer }
        purpose: { type: string }
    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - DATA_CHECK
        - INFO_REQUESTED
        - SCORING
        - MANUAL_REVIEW
        - APPROVED
        - COUNTER_OFFER
        - REJECTED
        - SIGNING
        - SIGNED
        - DISBURSED
        - ACTIVE
        - OVERDUE
        - CLOSED
    Application:
      type: object
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        input: { $ref: "#/components/schemas/ApplicationInput" }
        history:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              at: { type: string, format: date-time }
    ValidationError:
      type: object
      properties:
        missing_fields:
          type: array
          items: { type: string }
    DecisionInput:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [APPROVED, COUNTER_OFFER, REJECTED] }
        amount: { type: number }
        rate: { type: number }
        comment: { type: string }
