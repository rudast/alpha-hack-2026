openapi: 3.0.3
info:
  title: Умный кредитный кабинет — API
  version: 0.1.0
  description: >
    Реализованы `/healthz`, вход (`/api/v1/auth/*`), `/api/v1/me`, `/api/v1/me/bootstrap`, `/api/v1/me/offer`,
    `/api/v1/products`, `/api/v1/loans` и методы заявок клиента (`/api/v1/applications`: черновик, отправка,
    ответ на решение банка, документы). рабочее место сотрудника (`/api/v1/employee/applications`). `/api/v1/calculator` — черновой контракт.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: client
  - name: employee
paths:
  /healthz:
    get:
      tags: [system]
      summary: Проверка работоспособности
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход, шаг 1 — пароль
      description: >
        И клиент, и сотрудник могут войти по телефону или по почте (поле `login`) и паролю;
        роль выбирается переключателем «Клиентам / Сотрудникам». После проверки пароля
        отправляется код второго фактора (сейчас заглушка, принимает код из `OTP_STUB_CODE`,
        по умолчанию `000000`). Сессия на этом шаге не создаётся.
        На любую проблему с учётными данными (нет такого пользователя, неверный пароль,
        неподходящая роль) возвращается один и тот же ответ 401.
        После трёх неудачных попыток вход блокируется на 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Пароль верен, код отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Некорректное тело запроса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Неверные учётные данные
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Слишком много неудачных попыток
          headers:
            Retry-After:
              schema: { type: integer }
              description: Секунд до снятия блокировки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Внутренняя ошибка (например, недоступны база или Redis)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/verify:
    post:
      tags: [auth]
      summary: Вход, шаг 2 — код второго фактора
      description: >
        Проверяет код и создаёт сессию. Вызов `challenge_id` одноразовый, живёт 5 минут;
        после трёх неверных кодов он аннулируется. Поле `redirect` определяет сервер по роли:
        `/personalAccount` для клиента, `/employee` для сотрудника.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Некорректное тело запроса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Неверный код либо вызов не найден, истёк или уже использован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Внутренняя ошибка (например, недоступен Redis)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me/bootstrap:
    post:
      tags: [client]
      summary: Обновить показатели долговой нагрузки после входа
      description: >
        Вызывается клиентом после входа. Если коэффициент долговой нагрузки ни разу не считался
        или старше 12 часов, запрашивает кредитную историю у воркера и ждёт ответа не дольше
        `WORKER_TIMEOUT` (по умолчанию 8 секунд). Если данные устарели, а воркер не ответил
        или вернул ошибку, возвращаются прежние значения. Если данных не было вовсе, ответ 503.
        Сценарий реализован отдельным методом сервиса, его можно вызывать и из других мест.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Показатели долговой нагрузки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          description: Нет сессии (токен отсутствует, неверный или истёк)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Компания клиента не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Внутренняя ошибка (например, недоступна база или Redis)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Воркер не ответил вовремя или вернул ошибку, а данных о компании ещё не было; повторите запрос
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me/offer:
    get:
      tags: [client]
      summary: Предварительное предложение для баннера в кабинете
      description: >
        Возвращает действующее предварительное предложение компании («до X ₽, ставка от Y %»).
        Если его нет, оно истекло или данные компании обновились после расчёта (новый `/me/bootstrap`),
        сервер считает новое по сохранённым данным компании и каталогу продуктов; воркер не вызывается.
        Окончательное решение принимает скоринг при подаче заявки. Подробно: docs/preapproved-offer.md.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Предложение (`offer`) либо `offer = null` и причина (`reason`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me:
    get:
      tags: [client]
      summary: Профиль клиента и его компании
      description: Приветствие, профиль компании, подстановка в анкету. Пользователь и компания берутся из сессии.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Профиль; поля без данных приходят как null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/products:
    get:
      tags: [client]
      summary: Каталог кредитных продуктов
      description: >
        Без авторизации: калькулятор открыт до входа. Значения (ставки, суммы, сроки, правило 9 месяцев)
        совпадают с калькулятором. `field_groups` — базовые группы полей плюс группы продукта.
      responses:
        "200":
          description: Список продуктов
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /api/v1/loans:
    get:
      tags: [client]
      summary: Кредиты компании и кредиты в других банках
      description: >
        Кредит — это заявка в статусе ACTIVE, OVERDUE или CLOSED (отдельной таблицы нет). График платежей
        не хранится, а считается на лету (аннуитет) из суммы, ставки, срока, даты выдачи и числа внесённых
        платежей. Статус действующего кредита считается по графику: OVERDUE, если дата следующего платежа
        прошла. `loans` — действующие (просроченные первыми), `closed_loans` — закрытые (новые первыми),
        `other_banks` — из ответа БКИ (`companies.credit_history.other_banks`).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Кредиты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoansResponse" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications:
    post:
      tags: [client]
      summary: Создать черновик заявки (первое сохранение формы)
      description: >
        Черновик создаётся при первом сохранении, а не при открытии формы, поэтому все поля
        необязательны. Компания и автор берутся из сессии. Брошенные черновики будут удаляться
        через 30 дней (пока не реализовано). Запрос идемпотентен: нужен заголовок `Idempotency-Key`.

        По предварительному предложению (кнопка «Оформить»): в теле передаётся `offer_id`. Продукт,
        сумма и срок берутся из предложения, `product_id`, `amount` и `term_months` из тела игнорируются.
        Если черновик по этому предложению уже есть, возвращается он (ответ 200).
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "200":
          description: Черновик по этому предложению уже был создан (передан `offer_id`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "201":
          description: Черновик создан
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Неизвестный продукт, отрицательное число, некорректное тело либо не передан или некорректен Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Предложение `offer_id` не найдено или принадлежит другой компании
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Запрос с этим Idempotency-Key ещё выполняется либо предложение уже использовано или отозвано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Срок действия предложения истёк; перезапросите `GET /me/offer`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Idempotency-Key уже использован для другого запроса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [client]
      summary: Список заявок компании
      description: Заявки текущей компании от новых к старым. Статус берётся из базы.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Список заявок (может быть пустым)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationSummary" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}:
    get:
      tags: [client]
      summary: Заявка с историей статусов
      description: >
        Заявка возвращается только владельцу: ИНН берётся из сессии и входит в сам запрос к базе.
        Чужая и несуществующая заявки неразличимы, в обоих случаях 404.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [client]
      summary: Сохранить изменения черновика
      description: >
        Автосохранение. Меняются только переданные поля; `form`, если передана, заменяет форму
        целиком (передавайте текущую форму полностью). Менять можно только черновик.

        Защита от перезаписи: в теле обязательно передаётся `version` — версия заявки, которую
        клиент видел последней. Если заявка с тех пор менялась (другая вкладка, другой запрос),
        ответ 409 и ничего не сохраняется; нужно перечитать заявку и повторить. Каждое успешное
        изменение увеличивает версию на 1.

        Запрос идемпотентен: нужен заголовок `Idempotency-Key`. Повтор с тем же ключом
        (например, после обрыва связи) вернёт прежний ответ, а не ошибку устаревшей версии.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "200":
          description: Обновлённый черновик
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Неизвестный продукт, отрицательное число, некорректное тело, не передана version либо не передан или некорректен Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Заявка уже отправлена, менять нельзя; либо `version` устарела (заявка изменена другим
            запросом, перечитайте её); либо запрос с этим `Idempotency-Key` ещё выполняется
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Idempotency-Key уже использован для другого запроса либо сумма заявки по предложению больше
            его лимита (`reason: offer_amount_exceeded`). Смена продукта отвязывает заявку от предложения.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/submit:
    post:
      tags: [client]
      summary: Отправить заявку
      description: >
        Проверяет, что заполнены продукт, сумма, срок, цель и обязательные поля формы продукта
        (по каталогу), и что продукт доступен компании по типу организации, сумме и сроку.
        Затем переводит заявку из DRAFT в SUBMITTED. Повторная отправка даёт 409.
        Проверка обязательных документов появится вместе с их загрузкой.
        Сразу после сохранения задача уходит воркеру скоринга. Если отправка задачи не удалась,
        ответ всё равно успешный: заявку, которая остаётся в SUBMITTED, позже подберёт сборщик
        застрявших заявок (см. docs/worker-protocol.md).
        Запрос идемпотентен: нужен заголовок `Idempotency-Key`; повтор с тем же ключом вернёт
        прежний ответ.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка отправлена, статус SUBMITTED
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Не передан или некорректен Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка уже отправлена либо запрос с этим Idempotency-Key ещё выполняется
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Не заполнены обязательные поля (тело `{"missing_fields": [...]}`, поля формы
            в виде `группа.поле`), либо продукт недоступен компании или параметрам, либо Idempotency-Key
            уже использован для другого запроса (тело `{"error": "..."}`). Для заявки по предложению ещё:
            предложение истекло или отозвано (`reason: offer_expired`), сумма больше лимита
            (`reason: offer_amount_exceeded`). При успешной отправке предложение становится использованным.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ValidationError" }
                  - { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Показатели компании (долг, капитал) ещё ни разу не получены, а воркер не ответил вовремя.
            Заявка остаётся черновиком: повторите отправку через `Retry-After` секунд.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/accept:
    post:
      tags: [client]
      summary: Принять одобрение или встречное предложение
      description: >
        Из APPROVED или COUNTER_OFFER заявка проходит SIGNING, SIGNED, DISBURSED (подписание и выдача имитируются)
        и становится кредитом ACTIVE; все переходы пишутся в историю. Записываются ставка, номер договора и дата
        выдачи (сегодня). У встречного предложения сумма, срок и ставка берутся из `decision.offer`; ставка —
        `decision.offer.rate`, иначе `decision.rate`, иначе ставка продукта. Кредит появляется в `GET /loans`.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка целиком, как в `GET /applications/{id}`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка не ждёт ответа клиента (`application is not awaiting client decision`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/decline:
    post:
      tags: [client]
      summary: Отказаться от встречного предложения
      description: COUNTER_OFFER → DRAFT; клиент может изменить условия и подать заново. Связь с предварительным предложением снимается.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка в статусе DRAFT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка не в статусе COUNTER_OFFER
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/documents:
    post:
      tags: [client]
      summary: Загрузить документ к черновику
      description: >
        Файл сохраняется в Docker-том по схеме `<id заявки>/<вид>/<имя файла>`, в базе о документах ничего
        не хранится. Файл с тем же видом и именем заменяется. Только пока заявка в DRAFT. Тип файла
        определяется по содержимому: PDF, JPG или PNG. Пути к файлам передаются воркеру скоринга в задаче.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, description: "Вид документа из каталога: passport, account_statement…" }
                file: { type: string, format: binary, description: "PDF, JPG или PNG до 10 МБ" }
      responses:
        "201":
          description: Документ сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400":
          description: Неизвестный вид документа, файл не PDF/JPG/PNG или нет поля file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка не найдена (или принадлежит другой компании)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка уже отправлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Файл больше 10 МБ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/documents/{docId}:
    delete:
      tags: [client]
      summary: Удалить документ черновика
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: docId
          in: path
          required: true
          schema: { type: string }
          description: "`id` из списка документов заявки"
      responses:
        "204":
          description: Документ удалён
        "401":
          description: Нет сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Метод только для клиентов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Заявка или документ не найдены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка уже отправлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/applications/{id}/resume:
    post:
      tags: [client]
      summary: Отправить дополненную заявку обратно на проверку
      description: >
        Когда банк запросил дополнительные документы (статус `INFO_REQUESTED`, текст запроса в `info_request`),
        клиент загружает их (`POST /applications/{id}/documents` работает и в этом статусе) и вызывает этот метод.
        Если документы запросил сотрудник, заявка возвращается в общий пул ручной проверки (`MANUAL_REVIEW`);
        если воркер — на проверку данных (`DATA_CHECK`), задача воркеру отправляется заново.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка снова на проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404":
          description: Заявка не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка не ждёт дополнительных документов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/me:
    get:
      tags: [employee]
      summary: Текущий сотрудник
      description: ФИО, должность и почта сотрудника, который вошёл, — для шапки рабочего места.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Сотрудник
          content:
            application/json:
              schema:
                type: object
                properties:
                  full_name: { type: string, example: Сидорова Анна Сергеевна }
                  position: { type: string, nullable: true, example: Андеррайтер МСБ }
                  email: { type: string, nullable: true, example: underwriter@example.test }
        "403":
          description: Метод только для сотрудников
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications:
    get:
      tags: [employee]
      summary: Заявки на ручной проверке
      description: >
        Общий пул: заявки в `MANUAL_REVIEW`, которые никто не взял в работу, старые первыми.
        С `mine=true` — заявки, которые взял текущий сотрудник. Только для роли `employee`.
      security: [{ bearer: [] }]
      parameters:
        - name: mine
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Список заявок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewSummary" }
        "403":
          description: Метод только для сотрудников
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications/{id}:
    get:
      tags: [employee]
      summary: Карточка заявки
      description: Заявка (форма, решение скоринга, история, документы), данные компании и ФИО взявшего её сотрудника.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "404":
          description: Заявка не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications/{id}/documents/{docId}:
    get:
      tags: [employee]
      summary: Скачать документ заявки
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Файл (PDF, JPG или PNG)
          content:
            application/pdf: {}
            image/jpeg: {}
            image/png: {}
        "404":
          description: Заявка или документ не найдены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications/{id}/take:
    post:
      tags: [employee]
      summary: Взять заявку в работу
      description: >
        Закрепляет заявку из общего пула за сотрудником; она пропадает из пула. Если сотрудник
        ничего не решил за 2 часа, заявка сама возвращается в пул. Повторный вызов тем же сотрудником безопасен.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка взята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "404":
          description: Заявка не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Заявку уже взял другой сотрудник (`{"error": "...", "assigned_name": "ФИО"}`) либо она не на ручной проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications/{id}/release:
    post:
      tags: [employee]
      summary: Вернуть заявку в общий пул
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Заявка в пуле
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "409":
          description: Заявка не закреплена за этим сотрудником или не на ручной проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/employee/applications/{id}/decision:
    post:
      tags: [employee]
      summary: Решение по заявке на ручной проверке
      description: >
        Решать может только сотрудник, взявший заявку в работу. `approve` — `APPROVED`;
        `reject` — `REJECTED`, причина `reason` обязательна (видна клиенту в `decision.reason`);
        `request_info` — `INFO_REQUESTED`, текст `info_request` обязателен, заявка открепляется и после ответа
        клиента вернётся в общий пул; `counter_offer` — `COUNTER_OFFER` с условиями в `decision.offer`:
        `amount`, `term_months`, `rate` обязательны, `product_id` по умолчанию продукт заявки. Другой продукт
        можно предложить, только если для него у заявки уже заполнены поля формы и загружены документы,
        и он доступен компании (тип организации, возраст бизнеса, сумма и срок).
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionInput"
      responses:
        "200":
          description: Решение принято
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCard" }
        "400":
          description: Неизвестное действие, продукт или некорректные сумма, срок, ставка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Заявка не взята этим сотрудником или уже не на ручной проверке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Не хватает причины, текста запроса или данных для другого продукта
            (`{"missing_fields": [...]}`, документы как `documents.<вид>`), либо продукт недоступен компании
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ValidationError" }
                  - { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: >
        Уникальный ключ операции, который клиент создаёт сам (например, UUID) и держит, пока не
        получит ответ. Делает изменяющий запрос безопасным для повтора: первый запрос выполняется,
        повтор с тем же ключом и тем же содержимым возвращает тот же самый ответ (с заголовком
        `Idempotent-Replayed: true`), не выполняя действие второй раз. Ответ хранится 24 часа.
        Ключи разных пользователей не пересекаются. Ответы сервера с ошибкой 5xx не запоминаются,
        повтор выполнится заново.

        Ошибки: ключ не передан или не подходит по длине (8–128 печатных символов без пробелов) — 400;
        ключ уже использован для другого запроса — 422; запрос с этим ключом ещё выполняется — 409.
        Для нового действия нужен новый ключ.
  headers:
    IdempotentReplayed:
      description: Равен true, если ответ повторён из сохранённого по этому Idempotency-Key, а действие второй раз не выполнялось
      schema: { type: string, enum: ["true"] }
  schemas:
    LoginRequest:
      type: object
      required: [role, login, password]
      description: "ИНН при входе не вводится: сервер берёт его из компании, привязанной к клиенту."
      properties:
        role: { type: string, enum: [client, employee] }
        login:
          type: string
          description: >
            Телефон (+79990000001, 89990000001, 8 (999) 000-00-01) или почта.
            Если в значении есть «@», оно считается почтой.
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        challenge_id: { type: string }
    VerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string }
        code: { type: string }
    VerifyResponse:
      type: object
      properties:
        token: { type: string, description: Передаётся в заголовке Authorization как Bearer }
        role: { type: string, enum: [client, employee] }
        redirect:
          type: string
          enum: [/personalAccount, /employee]
          description: Куда перейти после входа; выбирается сервером по роли
    Error:
      type: object
      required: [error]
      description: >
        Тело любого ответа с ошибкой. Ориентироваться нужно на HTTP-код, текст в `error`
        предназначен для показа и логов и может меняться.
      properties:
        error:
          type: string
          example: invalid credentials
        reason:
          type: string
          description: Машиночитаемая причина, если она есть (например, `offer_expired`, `offer_amount_exceeded`)
    Bootstrap:
      type: object
      properties:
        inn: { type: string }
        total_debt: { type: integer, format: int64, nullable: true, description: Общий долг по всем банкам, рубли }
        equity: { type: integer, format: int64, nullable: true, description: Собственный капитал, рубли }
        debt_to_equity:
          type: number
          nullable: true
          description: Общий долг / собственный капитал; null, если капитал нулевой или отрицательный
        fetched_at: { type: string, format: date-time, nullable: true }
    Profile:
      type: object
      properties:
        user:
          type: object
          properties:
            full_name: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            position: { type: string, nullable: true }
        company:
          type: object
          properties:
            inn: { type: string }
            org_type: { type: string, enum: [IP, OOO] }
            name: { type: string }
            ogrn: { type: string, nullable: true }
            okved: { type: string }
            okved_title: { type: string, nullable: true }
            registration_date: { type: string, format: date, nullable: true }
            director: { type: string, nullable: true }
            address: { type: string, nullable: true }
            status: { type: string, nullable: true }
            account_number: { type: string, nullable: true, description: Расчётный счёт в нашем банке }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        rate: { type: number, description: "Базовая ставка, % годовых" }
        min_amount: { type: integer, format: int64 }
        max_amount: { type: integer, format: int64 }
        min_term_months: { type: integer }
        max_term_months: { type: integer }
        collateral: { type: string, enum: [none, optional, required] }
        org_types: { type: array, items: { type: string, enum: [IP, OOO] } }
        needs_9_months: { type: boolean, description: Бизнесу должно быть не меньше 9 месяцев }
        young_max_amount: { type: integer, format: int64, nullable: true, description: Лимит для бизнеса младше 9 месяцев; null — отдельного лимита нет }
        field_groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              title: { type: string }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    label: { type: string }
                    type: { type: string, enum: [text, number, money, bool, select] }
                    required: { type: boolean }
                    options: { type: array, items: { type: string } }
        documents:
          type: object
          properties:
            required: { type: array, items: { $ref: "#/components/schemas/DocumentKind" } }
            optional: { type: array, items: { $ref: "#/components/schemas/DocumentKind" } }
    DocumentKind:
      type: object
      properties:
        kind: { type: string }
        title: { type: string }
    Document:
      type: object
      properties:
        id: { type: string, description: Идентификатор для удаления }
        kind: { type: string }
        filename: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string, enum: [UPLOADED] }
        created_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        number: { type: integer }
        date: { type: string, format: date }
        amount: { type: number }
        principal: { type: number }
        interest: { type: number }
        balance_after: { type: number }
        status: { type: string, enum: [PAID, NEXT, OVERDUE, PLANNED] }
    Loan:
      type: object
      properties:
        id: { type: string, format: uuid, description: Идентификатор заявки }
        product_id: { type: string }
        product_name: { type: string }
        contract_number: { type: string }
        amount: { type: integer, format: int64 }
        rate: { type: number }
        term_months: { type: integer }
        issued_at: { type: string, format: date }
        closed_at: { type: string, format: date, nullable: true, description: Только у закрытых }
        maturity_date: { type: string, format: date, description: Дата последнего платежа по графику на полный срок }
        status: { type: string, enum: [ACTIVE, OVERDUE, CLOSED] }
        monthly_payment: { type: number }
        principal_left: { type: integer, format: int64 }
        paid_total: { type: integer, format: int64 }
        payments_made: { type: integer }
        payments_total: { type: integer }
        next_payment:
          nullable: true
          type: object
          properties:
            date: { type: string, format: date }
            amount: { type: number }
        overdue_amount: { type: number, description: Только у действующих }
        closed_early: { type: boolean, description: Только у закрытых }
        months_early: { type: integer, description: Только у закрытых }
        overpayment: { type: integer, format: int64, description: "Только у закрытых: paid_total − amount" }
        late_payments: { type: integer, description: Только у закрытых }
        schedule:
          type: array
          description: Все платежи; у закрытого кредита только внесённые
          items: { $ref: "#/components/schemas/Payment" }
    LoansResponse:
      type: object
      properties:
        loans: { type: array, items: { $ref: "#/components/schemas/Loan" } }
        closed_loans: { type: array, items: { $ref: "#/components/schemas/Loan" } }
        other_banks:
          type: array
          items:
            type: object
            properties:
              bank: { type: string }
              kind: { type: string }
              debt: { type: integer, format: int64 }
    OfferResponse:
      type: object
      properties:
        offer:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            product_id: { type: string }
            product_name: { type: string }
            max_amount: { type: integer, format: int64, description: Лимит, рубли }
            term_months: { type: integer }
            rate_from: { type: number, description: "Ставка «от», % годовых" }
            valid_until: { type: string, format: date, description: Последний день действия }
        reason:
          type: string
          enum: [no_data, no_equity, overdue, registry_flags, no_product, high_debt_load]
          description: Почему предложения нет (только при `offer = null`); в баннере не показывается
    DraftInput:
      type: object
      description: >
        Все поля необязательны; непереданные поля не меняются. Исключение: при изменении черновика
        (`PATCH`) обязательна `version`; при создании она игнорируется.
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия заявки, которую клиент видел последней (только для PATCH)
        offer_id:
          type: string
          format: uuid
          description: Предварительное предложение (только при создании); продукт, сумма и срок берутся из него
        product_id: { type: string, description: Идентификатор продукта из каталога }
        amount: { type: integer, format: int64, minimum: 0, description: Сумма, рубли }
        term_months: { type: integer, minimum: 0 }
        purpose: { type: string }
        form:
          type: object
          description: >
            Данные формы блоками по группам полей: `form.<группа>.<поле>`, например
            `form.applicant.position`. Какие группы и поля нужны, определяет продукт в каталоге.
          additionalProperties: true
          example:
            applicant: { position: Генеральный директор, has_collateral: false }
    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - DATA_CHECK
        - INFO_REQUESTED
        - SCORING
        - MANUAL_REVIEW
        - APPROVED
        - COUNTER_OFFER
        - REJECTED
        - SIGNING
        - SIGNED
        - DISBURSED
        - ACTIVE
        - OVERDUE
        - CLOSED
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, description: Растёт на 1 при каждом изменении; передаётся обратно в PATCH }
        company_inn: { type: string }
        product_id: { type: string }
        amount: { type: integer, format: int64 }
        term_months: { type: integer }
        purpose: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        form: { type: object, additionalProperties: true }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" }, description: Файлы из тома (в базе не хранятся) }
        history:
          type: array
          items:
            type: object
            properties:
              from: { $ref: "#/components/schemas/ApplicationStatus" }
              to: { $ref: "#/components/schemas/ApplicationStatus" }
              at: { type: string, format: date-time }
              by: { type: string, description: "Кто выполнил переход: идентификатор пользователя, `worker` или `system` (имитация выдачи)" }
              comment: { type: string, description: Пояснение к переходу (необязательное) }
        decision: { type: object, description: Решение по заявке; появится после скоринга }
        offer_id: { type: string, format: uuid, nullable: true, description: Предварительное предложение, по которому создана заявка }
        info_request: { type: string, nullable: true, description: Что банк просит дополнить (статус INFO_REQUESTED) }
        submitted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationSummary:
      type: object
      description: Строка списка заявок (до выдачи кредита; выданные кредиты — в `GET /loans`). Название статуса для пользователя задаёт фронт.
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string }
        product_name: { type: string }
        amount: { type: integer, format: int64 }
        term_months: { type: integer }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        submitted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        decision: { type: object, nullable: true, description: "Решение банка (в том числе встречное предложение `offer`), чтобы показать его без открытия заявки" }
    ValidationError:
      type: object
      required: [missing_fields]
      properties:
        missing_fields:
          type: array
          items: { type: string }
    ReviewDecisionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject, request_info, counter_offer] }
        reason: { type: string, description: Причина (обязательна при reject) или комментарий }
        info_request: { type: string, description: Что запросить у клиента (обязательно при request_info) }
        product_id: { type: string, description: Продукт встречного предложения; по умолчанию продукт заявки }
        amount: { type: integer, format: int64 }
        term_months: { type: integer }
        rate: { type: number, description: "Ставка, % годовых" }
    ReviewSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_inn: { type: string }
        company_name: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        amount: { type: integer, format: int64 }
        term_months: { type: integer }
        submitted_at: { type: string, format: date-time }
        assigned_to: { type: string, format: uuid, nullable: true }
        assigned_name: { type: string, nullable: true }
        assigned_at: { type: string, format: date-time, nullable: true }
    ReviewCard:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            product_name: { type: string }
            company:
              type: object
              properties:
                inn: { type: string }
                org_type: { type: string }
                name: { type: string }
                okved: { type: string }
                okved_title: { type: string, nullable: true }
                registration_date: { type: string, format: date, nullable: true }
                total_debt: { type: integer, format: int64, nullable: true }
                equity: { type: integer, format: int64, nullable: true }
                debt_to_equity: { type: number, nullable: true }
            assigned_to: { type: string, format: uuid, nullable: true }
            assigned_name: { type: string, nullable: true, description: ФИО сотрудника, взявшего заявку }
            assigned_at: { type: string, format: date-time, nullable: true }
