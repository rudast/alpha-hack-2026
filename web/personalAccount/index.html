<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — Альфа-Будущее</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ef3124'/%3E%3Cpath fill='white' transform='translate(3.6 3.6) scale(.7)' d='M13.6 3h-3.2L5 17h2.8l1.2-3.4h6l1.2 3.4H19L13.6 3zm-3.6 8.2L12 5.5l2 5.7h-4zM5 19.5h14V22H5v-2.5z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/core.css?v=3" />
  <link rel="stylesheet" href="/assets/css/cabinet.css?v=3" />
</head>
<body>

  <header class="topbar">
    <a href="/personalAccount/" class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.6 3h-3.2L5 17h2.8l1.2-3.4h6l1.2 3.4H19L13.6 3zm-3.6 8.2L12 5.5l2 5.7h-4zM5 19.5h14V22H5v-2.5z"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Альфа-Будущее</div>
        <div class="brand-caption">Умный кредитный кабинет предпринимателя</div>
      </div>
    </a>

    <div class="topbar-actions">
      <div class="company-chip hidden" id="company-chip">
        <div class="company-chip-name" id="chip-name"></div>
        <div class="company-chip-inn" id="chip-inn"></div>
      </div>
      <a href="#new-loan" class="btn btn-primary btn-inline" id="btn-new-loan">Взять кредит</a>
      <button type="button" id="btn-logout" class="btn btn-secondary btn-inline">Выйти</button>
    </div>
  </header>

  <main class="content">

    <!-- ============ Главная кабинета ============ -->
    <div id="view-overview">

      <div class="page-head">
        <div>
          <h1 class="page-title" id="greeting">Личный кабинет</h1>
          <p class="page-subtitle" id="greeting-sub">Кредиты, заявки и долговая нагрузка вашего бизнеса</p>
        </div>
      </div>

      <div id="error-plate" class="error-plate" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm-1 5a1 1 0 012 0v6a1 1 0 11-2 0V7zm1 11a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z"/>
        </svg>
        <span id="error-message"></span>
        <button type="button" id="btn-retry" class="plate-action hidden">Повторить</button>
      </div>

      <!-- Предодобренное предложение (GET /me/offer) -->
      <section id="offer" class="offer hidden" aria-label="Предложение банка"></section>

      <!-- Сводка: долг и нагрузка из /me/bootstrap, платежи из /loans -->
      <section class="summary" id="summary" aria-label="Сводка">
        <div class="tile skeleton"></div>
        <div class="tile skeleton"></div>
        <div class="tile skeleton"></div>
        <div class="tile skeleton"></div>
      </section>

      <div class="layout">
        <div class="layout-main">

          <section class="block" aria-labelledby="loans-title">
            <div class="block-head">
              <h2 id="loans-title">Мои кредиты</h2>
              <span class="block-count" id="loans-count"></span>
            </div>
            <div id="loans"><div class="card-row skeleton"></div></div>
          </section>

          <section class="block" aria-labelledby="apps-title">
            <div class="block-head">
              <h2 id="apps-title">Мои заявки</h2>
              <span class="block-count" id="apps-count"></span>
            </div>
            <div id="applications"><div class="card-row skeleton"></div></div>
          </section>

          <section class="block hidden" id="other-banks-block" aria-labelledby="other-title">
            <div class="block-head">
              <h2 id="other-title">Кредиты в других банках</h2>
              <span class="block-hint">по данным бюро кредитных историй</span>
            </div>
            <div id="other-banks"></div>
          </section>

        </div>

        <aside class="layout-side">
          <section class="panel" aria-labelledby="profile-title">
            <div class="panel-head">
              <h2 id="profile-title">Компания</h2>
              <span class="source-badge" title="Сведения получены из государственного реестра, изменить их можно только в ФНС">из ЕГРЮЛ</span>
            </div>
            <div id="profile"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div></div>
          </section>

          <section class="panel" aria-labelledby="contact-title">
            <h2 id="contact-title" class="panel-title">Контакты для связи</h2>
            <div id="contacts"><div class="skeleton skeleton-text"></div></div>
          </section>
        </aside>
      </div>
    </div>

    <!-- ============ Мастер новой заявки ============ -->
    <div id="view-wizard" class="hidden">
      <section class="wizard" aria-labelledby="wizard-title">
        <div class="wizard-head">
          <button type="button" class="btn-back" id="wizard-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M10.7 5.3a1 1 0 010 1.4L6.4 11H20a1 1 0 110 2H6.4l4.3 4.3a1 1 0 01-1.4 1.4l-6-6a1 1 0 010-1.4l6-6a1 1 0 011.4 0z"/>
            </svg>
            В кабинет
          </button>
          <h1 class="page-title" id="wizard-title">Новый кредит</h1>
          <ol class="stepper" id="wizard-stepper" aria-label="Шаги заявки"></ol>
        </div>

        <div id="wizard-error" class="error-plate" role="alert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm-1 5a1 1 0 012 0v6a1 1 0 11-2 0V7zm1 11a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z"/>
          </svg>
          <span id="wizard-error-message"></span>
        </div>

        <div class="wizard-body" id="wizard-body"></div>

        <div class="wizard-foot" id="wizard-foot">
          <button type="button" class="btn btn-secondary btn-inline" id="wizard-prev">Назад</button>
          <span class="wizard-saved" id="wizard-saved" aria-live="polite"></span>
          <button type="button" class="btn btn-primary btn-inline" id="wizard-next">Далее</button>
        </div>
      </section>
    </div>

  </main>

  <!-- Окно для подробностей заявки, графика платежей и заглушек -->
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button type="button" class="dialog-close" id="dialog-close" aria-label="Закрыть">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>

  <script src="/assets/js/api.js?v=3"></script>
  <script src="/assets/js/mock-api.js?v=3"></script>
  <script src="/assets/js/loans.js?v=3"></script>
  <script src="/assets/js/catalog.js?v=3"></script>
  <script src="/assets/js/ui.js?v=3"></script>
  <script src="/assets/js/wizard.js?v=3"></script>
  <script src="/assets/js/cabinet.js?v=3"></script>
</body>
</html>
